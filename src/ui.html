<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gigs</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 ui-monospace, monospace; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  a { color: inherit; }
  h2 { font-size: 1em; margin: 1.5em 0 .3em; opacity: .6; }
  h2:has(.st) { opacity: 1; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: .1em 0; }
  .dim { opacity: .55; }
  .st { font-weight: bold; }
  .in_progress { color: #3b82f6; }
  .ready, .active { color: #16a34a; }
  .blocked { color: #dc2626; }
  .deferred, .draft { color: #a855f7; }
  .open { color: #ca8a04; }
  .closed, .done { color: #888; }
  pre { white-space: pre-wrap; margin: .3em 0 1em; }
  nav button { float: right; }
  button, input { font: inherit; }
  .err { color: #dc2626; }
</style>
<nav><a href="#">gigs</a> <span id="crumb"></span><button id="signout" hidden>sign out</button></nav>
<main id="main"></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const link = (g) => `<a href="#g/${esc(g.id)}">${esc(g.id)}</a> ${esc(g.title)}`;
const st = (status) => `<span class="st ${esc(status)}">${esc(String(status).replace("_", " "))}</span>`;
const ago = (t) => (t ? new Date(t).toLocaleString() : "");

const SIGNED_OUT = "signed out";

async function api(path, token = localStorage.getItem("gigs-token")) {
  const res = await fetch(path, { headers: token ? { Authorization: `Bearer ${token}` } : {} });
  if (res.status === 401) throw new Error(SIGNED_OUT);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error?.message ?? res.status);
  return body;
}

async function projects() {
  const ps = await api("/projects");
  // One project (e.g. a project token): open it. replace() keeps home out of history, so Back doesn't bounce here again.
  if (ps.length === 1) {
    location.replace(`#p/${encodeURIComponent(ps[0].prefix)}`); // hashchange renders it
    return "";
  }
  return ps.map((p) => `<li><a href="#p/${esc(p.prefix)}">${esc(p.prefix)}</a> ${esc(p.name)}</li>`).join("");
}

const specLink = (s) => `<a href="#s/${esc(s.id)}">${esc(s.id)}</a> ${esc(s.title)}`;

async function project(id) {
  const [gigs, ready, specs] = await Promise.all([api(`/projects/${id}/gigs?all=1`), api(`/projects/${id}/ready`), api(`/projects/${id}/specs?all=1`)]);
  return (specs.length ? `<h2>specs (${specs.length})</h2><ul>${specs.map((s) => `<li>${specLink(s)} ${st(s.status)}</li>`).join("")}</ul>` : "") +
    gigGroups(gigs, ready);
}

async function spec(id) {
  const s = await api(`/specs/${id}`);
  const gigs = await api(`/projects/${encodeURIComponent(s.project)}/gigs?spec=${id}&all=1`);
  $("#crumb").innerHTML = `/ <a href="#p/${esc(s.project)}">${esc(s.project)}</a>`;
  return `<h1 style="font-size:1.2em">${esc(s.id)} ${esc(s.title)}</h1>
    <div>${st(s.status)} <span class=dim>· v${esc(s.version)}<br>created ${ago(s.created_at)} by ${esc(s.created_by)}${s.closed_at ? `<br>closed ${ago(s.closed_at)}: ${esc(s.close_reason)}` : ""}</span></div>
    <pre>${esc(s.text)}</pre>
    ${gigs.length ? `<h2>gigs (${gigs.length})</h2><ul>${gigs.map((g) => `<li>${link(g)} ${st(g.status)}</li>`).join("")}</ul>` : ""}`;
}

function gigGroups(gigs, ready) {
  const readyIds = new Set(ready.map((g) => g.id));
  const groups = { in_progress: [], ready: [], blocked: [], deferred: [], closed: [] };
  for (const g of gigs) groups[g.status === "open" ? (readyIds.has(g.id) ? "ready" : "blocked") : g.status].push(g);
  groups.closed.sort((a, b) => (b.closed_at ?? "").localeCompare(a.closed_at ?? ""));
  return Object.entries(groups).filter(([, gs]) => gs.length).map(([name, gs]) =>
    `<h2>${st(name)} (${gs.length})</h2><ul>` +
    gs.map((g) => `<li>${link(g)} <span class="dim">p${g.priority} ${g.type}${g.human ? " human" : ""}${g.claimed_by ? " @" + esc(g.claimed_by) : ""}${g.labels?.length ? " #" + g.labels.map(esc).join(" #") : ""}</span></li>`).join("") +
    "</ul>").join("") || "<p class=dim>no gigs</p>";
}

async function gig(id) {
  const d = await api(`/gigs/${id}`);
  const g = d.gig;
  $("#crumb").innerHTML = `/ <a href="#p/${esc(g.project)}">${esc(g.project)}</a>`;
  const rel = (name, list) => (list?.length ? `<h2>${name}</h2><ul>${list.map((x) => `<li>${link(x)} ${st(x.status)}</li>`).join("")}</ul>` : "");
  const meta = [g.type, `p${g.priority}`, g.human && "human", g.claimed_by && `@${g.claimed_by}`, ...(g.labels ?? []).map((l) => `#${l}`)].filter(Boolean).map(esc).join(" · ") +
    (g.spec ? ` · spec <a href="#s/${esc(g.spec)}">${esc(g.spec)}</a>` : "");
  return `<h1 style="font-size:1.2em">${esc(g.id)} ${esc(g.title)}</h1>
    <div>${st(g.status === "open" ? (d.ready ? "ready" : "blocked") : g.status)} <span class=dim>· ${meta}</span></div>
    <div class=dim>created ${ago(g.created_at)} by ${esc(g.created_by)}${g.closed_at ? `<br>closed ${ago(g.closed_at)}: ${esc(g.close_reason)}` : ""}</div>
    ${g.description ? `<pre>${esc(g.description)}</pre>` : ""}
    ${d.parent ? rel("parent", [d.parent]) : ""}${rel("children", d.children)}${rel("blocked by", d.blockers)}${rel("blocks", d.blocks)}
    ${rel("related", d.related)}${rel("discovered from", d.discovered_from)}${rel("discovered", d.discovered)}
    ${d.comments?.length ? `<h2>comments</h2>${d.comments.map((c) => `<div class=dim>${esc(c.author)} · ${ago(c.created_at)}</div><pre>${esc(c.body)}</pre>`).join("")}` : ""}`;
}

function signIn(error = "") {
  $("#signout").hidden = true;
  $("#main").innerHTML = `<form id="signin"><p>sign in with a gigs token</p>
    <input id="token" type="password" name="token" placeholder="token" autocomplete="current-password" required autofocus>
    <button>sign in</button>${error ? `<p class="err">${esc(error)}</p>` : ""}</form>`;
  $("#signin").onsubmit = async (e) => {
    e.preventDefault();
    const token = $("#token").value.trim();
    try {
      await api("/projects", token);
    } catch (err) {
      return signIn(err.message === SIGNED_OUT ? "token rejected" : err.message);
    }
    localStorage.setItem("gigs-token", token);
    render();
  };
  $("#token").focus();
}

$("#signout").onclick = () => {
  localStorage.removeItem("gigs-token");
  if (location.hash) location.hash = ""; // hashchange renders
  else render();
};

async function render() {
  $("#signout").hidden = !localStorage.getItem("gigs-token");
  const [kind, id] = location.hash.slice(1).split("/").map(decodeURIComponent);
  $("#crumb").textContent = kind === "p" ? `/ ${id}` : "";
  try {
    $("#main").innerHTML = kind === "p" ? await project(encodeURIComponent(id))
      : kind === "g" ? await gig(encodeURIComponent(id))
      : kind === "s" ? await spec(encodeURIComponent(id))
      : `<ul>${await projects()}</ul>`;
  } catch (e) {
    if (e.message !== SIGNED_OUT) return ($("#main").innerHTML = `<p>error: ${esc(e.message)}</p>`);
    localStorage.removeItem("gigs-token");
    signIn();
  }
}

addEventListener("hashchange", render);
addEventListener("focus", () => $("#signin") || render());
render();
</script>
